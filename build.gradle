
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)' apply false // ForgeGradle 插件，版本范围 6.0.16 至 6.2（不含）
}

subprojects{
    apply plugin: 'net.minecraftforge.gradle'
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)  // 使用 Java 17
    }
    // 包含数据生成器生成的资源。
    sourceSets.main.resources { srcDir 'src/generated/resources' }

    repositories {
        // 在此处添加依赖仓库
        // ForgeGradle 会自动添加 Forge maven 和 Maven Central

        // 如果在 ./libs 中有模组 jar 依赖，可以像这样声明为仓库。
        // 参见 https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
        // flatDir {
        //     dir 'libs'
        // }
    }

    dependencies {
        // 指定使用的 Minecraft 版本。
        // 任何构件只要带有 "userdev" 分类器且是兼容的补丁构件即可。
        // "userdev" 分类器将由 ForgeGradle 请求并设置。
        // 如果组 ID 为 "net.minecraft" 且构件 ID 为 ["client", "server", "joined"] 之一，
        // 则会进行特殊处理，允许在无需外部仓库的情况下设置原版依赖。
        minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
        // 示例：使用 JEI 的模组依赖 - 使用 fg.deobf() 确保依赖被重映射到你的开发映射
        // JEI API 在编译时使用，而完整的 JEI 构件在运行时使用
        // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
        // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
        // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

        // 示例：使用 flat dir 仓库从 ./libs 加载模组 jar 依赖
        // 这映射到 ./libs/coolmod-${mc_version}-${coolmod_version}.jar
        // 搜索时忽略组 ID —— 此处为 "blank"
        // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

        // 更多信息：
        // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
        // http://www.gradle.org/docs/current/userguide/dependency_management.html
    }
    minecraft {
        // 映射（mappings）可随时更改，格式如下：
        // Channel:   Version:
        // official   MCVersion             Mojang 官方字段/方法名
        // parchment  YYYY.MM.DD-MCVersion  社区提供的参数名和 Javadoc（基于官方映射）
        //
        // 使用 'official' 或 'parchment' 映射时，请务必了解 Mojang 许可协议。
        // 更多信息：https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
        //
        // Parchment 是由 ParchmentMC 维护的非官方项目，与 MinecraftForge 无关。
        // 使用其映射需要额外设置：https://parchmentmc.org/docs/getting-started
        //
        // 使用非默认映射需自行承担风险，它们可能不总是有效。
        // 更改映射后，只需重新运行设置任务即可更新工作区。
        mappings channel: mapping_channel, version: mapping_version

        // 若设为 true，则所有 Eclipse/IntelliJ IDEA 运行配置在执行游戏前会先运行 "prepareX" 任务。
        // 大多数情况下无需启用。
        // enableEclipsePrepareRuns = true
        // enableIdeaPrepareRuns = true

        // 此属性允许 Gradle 的 ProcessResources 任务在 IDE 输出位置运行，并在启动游戏前执行。
        // 本模板必须设为 true 才能正常工作。
        // 参见 https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
        copyIdeResources = true

        // 若设为 true，则会将所有声明的运行配置的文件夹名称添加到生成的 IDE 运行配置中。
        // 文件夹名称可通过运行配置的 "folderName" 属性设置。
        // 默认情况下，运行配置的文件夹名称为包含它的 Gradle 项目名称。
        // generateRunFolders = true

        // 此属性用于在开发环境中启用访问转换器（Access Transformers）。
        // 它们将应用于 Minecraft 构件。
        // 访问转换器文件可以放在项目的任何位置。
        // 但最终模组 jar 中必须位于 "META-INF/accesstransformer.cfg" 才能被 Forge 加载。
        // 此默认位置是最佳实践，可自动将文件放入最终 jar 的正确位置。
        // 更多信息：https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/
        // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8' // 使用 UTF-8 字符集进行 Java 编译
    }
}